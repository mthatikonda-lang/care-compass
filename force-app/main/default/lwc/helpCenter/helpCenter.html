<template>
    <div class="page">
        <c-app-nav active="help" heading="How can we help?" subtitle="Answers to common questions about finding care, checking a bill and your account."></c-app-nav>

        <div class="body">
            <template for:each={groups} for:item="g">
                <section key={g.key} class="card">
                    <h2 class="card-title serif">{g.title}</h2>
                    <div class="faq">
                        <template for:each={g.items} for:item="it">
                            <details key={it.key} class="faq-item">
                                <summary class="faq-q">{it.question}</summary>
                                <p class="faq-a">{it.answer}</p>
                            </details>
                        </template>
                    </div>
                </section>
            </template>

            <section class="card cta">
                <div>
                    <h2 class="card-title serif">Still need help?</h2>
                    <p class="text">Email contact@carecompass.example.com or call (518) 555-0142. Care Compass does not provide medical care. For an emergency, call 911.</p>
                </div>
                <div class="cta-buttons">
                    <button class="btn btn-solid" onclick={goFindCare}>Find care</button>
                    <button class="btn btn-line" onclick={goCheckBill}>Check a bill</button>
                </div>
            </section>
        </div>
        <c-app-footer></c-app-footer>
    </div>
</template>
