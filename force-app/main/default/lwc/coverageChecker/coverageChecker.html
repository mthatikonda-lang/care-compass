<template>
    <div class="checker-shell">
        <template if:false={result}>
            <c-app-nav active="bill" heading="Know what you owe, before you pay" subtitle="Upload your bill and we'll compare every charge against your plan.">
                <div class="banner-steps">
                    <span class="banner-step"><span class="banner-dot">1</span>Upload</span>
                    <span class="banner-step"><span class="banner-dot">2</span>We compare</span>
                    <span class="banner-step"><span class="banner-dot">3</span>See what you owe</span>
                </div>
            </c-app-nav>
        </template>
        <template if:true={result}>
            <c-app-nav active="bill">
                <div class="prov-row prov-row-top">
                    <template if:true={result.hasProviderInfo}>
                        <div class="prov-badge">{result.providerInitials}</div>
                        <div class="prov-text">
                            <template if:true={result.providerNameText}><p class="prov-name">{result.providerNameText}</p></template>
                            <div class="prov-chips">
                                <template if:true={result.billNumberText}><span class="prov-chip">Bill no. <strong>{result.billNumberText}</strong></span></template>
                                <template if:true={result.billDateText}><span class="prov-chip">{result.billDateText}</span></template>
                                <template if:true={result.doctorName}><span class="prov-chip">{result.doctorName}</span></template>
                            </div>
                        </div>
                    </template>
                    <button class="home-pill result-back" onclick={handleBack}>&#8592; Back</button>
                </div>
            </c-app-nav>
        </template>

        <div class="checker-panel">
            <div class={contentClass}>

                <template if:false={result}>
                    <template if:true={errorMessage}>
                        <p class="error-text">{errorMessage}</p>
                    </template>

                    <div class="seg" role="tablist">
                        <button class={uploadTabClass} role="tab" onclick={handleTabUpload}>Upload a file</button>
                        <button class={manualTabClass} role="tab" onclick={handleTabManual}>Type line items</button>
                    </div>

                    <template if:true={isUploadTab}>
                        <div class="form-card upload-block">
                            <p class="panel-title">Choose a PDF, PNG or JPG</p>
                            <p class="panel-sub">Your file is read for text only and is not saved.</p>
                            <lightning-input
                                type="file"
                                label="Upload your bill"
                                variant="label-hidden"
                                accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"
                                onchange={handleFileChange}
                                disabled={isReading}>
                            </lightning-input>
                            <template if:true={isReading}>
                                <p class="form-hint">{readingStatus}</p>
                            </template>
                            <template if:true={uploadNote}>
                                <p class="form-hint">{uploadNote}</p>
                            </template>
                            <p class="form-hint">Up to 1 MB after resizing. The text is read by an outside reading service.</p>
                        </div>
                    </template>

                    <template if:true={showBillBox}>
                        <div class="form-card bill-box">
                            <lightning-textarea
                                label="Bill line items (please check these before you analyze)"
                                placeholder="Office Visit - Established Patient   99213   $150.00&#10;Basic Metabolic Panel   80048   $85.00"
                                value={billText}
                                onchange={handleBillText}
                                rows="8">
                            </lightning-textarea>
                            <p class="form-hint">One charge per line: description, optional 5-digit CPT code, then the amount.</p>
                        </div>
                    </template>

                    <p class="section-label">Details &middot; optional</p>
                    <div class="field-grid">
                        <div class="field-full">
                            <lightning-input
                                type="search"
                                label="Doctor on this bill"
                                placeholder="Leave blank if the bill doesn't name one"
                                value={doctorSearch}
                                onchange={handleDoctorSearch}
                                onkeyup={handleDoctorSearch}
                                oncommit={handleDoctorSearch}>
                            </lightning-input>
                            <template if:true={hasDoctorOptions}>
                                <lightning-combobox
                                    label="Pick the doctor"
                                    placeholder="Choose from the matches"
                                    options={doctorOptions}
                                    onchange={handleDoctorPick}>
                                </lightning-combobox>
                            </template>
                            <template if:true={noDoctorMatch}>
                                <p class="form-hint">No doctors match that name. Try just the last name.</p>
                            </template>
                        </div>
                        <div class="field-full">
                            <lightning-input label="Provider / practice" value={providerName} onchange={handleProviderName}></lightning-input>
                        </div>
                        <div>
                            <lightning-input label="Bill / account no." required value={billNumber} onchange={handleBillNumber}></lightning-input>
                            <p class="form-hint">It is on your bill, often near the date. Checking the same bill again updates it instead of saving a copy.</p>
                        </div>
                        <div>
                            <lightning-input type="date" label="Bill date" value={billDate} max={maxBillDate} onchange={handleBillDate}></lightning-input>
                        </div>
                    </div>

                    <button class="analyze-btn" onclick={handleAnalyze} disabled={isSubmitting}>{submitLabel}</button>
                    <template if:true={isSubmitting}>
                        <div class="progress" role="status" aria-live="polite">
                            <span class="progress-spin" aria-hidden="true"></span>
                            <span>{progressText}</span>
                        </div>
                    </template>
                    <p class="privacy-line">Your bill is checked against your plan and is not shared.</p>
                </template>

                <template if:true={result}>
                    <div class="print-only print-sheet">
                    <div class="ps-head">
                        <div class="ps-lockup">
                            <svg width="34" height="39" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2 L37 8 V23 C37 33 30 40 20 44 C10 40 3 33 3 23 V8 Z" fill="#24335C" stroke="#E8A33D" stroke-width="2" stroke-linejoin="round"></path><path d="M7 24 H14 L17 15 L22 32 L26 21 L28 24 H33" fill="none" stroke="#E8A33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            <span class="ps-brand">Care Compass</span>
                        </div>
                        <div class="ps-head-r">Estimated bill summary</div>
                    </div>

                    <div class="ps-hero">
                        <div class="ps-hero-main">
                            <div class="ps-hero-label">Estimated amount you owe <span class="ps-seal">Estimate</span></div>
                            <div class="ps-hero-amt">{result.totalOwedText}</div>
                            <div class="ps-hero-sub">of {result.totalBilledText} billed</div>
                        </div>
                        <div class="ps-hero-stats">
                            <div class="ps-stat"><span>Total billed</span><b>{result.totalBilledText}</b></div>
                            <div class="ps-stat"><span>Insurance pays</span><b class="ps-stat-ins">{result.insurancePaysText}</b></div>
                            <div class="ps-stat"><span>You pay</span><b>{result.owePct}%</b></div>
                        </div>
                        <div class="ps-bar"><div class="ps-bar-ins" style={result.barInsStyle}></div><div class="ps-bar-owe" style={result.barOweStyle}></div></div>
                        <div class="ps-bar-labels">
                            <span><i class="ps-bdot ps-bdot-ins"></i>Insurance pays <b>{result.insurancePaysText}</b> &middot; {result.insPct}%</span>
                            <span><i class="ps-bdot ps-bdot-owe"></i>You owe <b>{result.totalOwedText}</b> &middot; {result.owePct}%</span>
                        </div>
                    </div>

                    <div class="ps-meta-strip">
                        <template if:true={result.providerNameText}><span class="ps-mi"><i>Provider</i>{result.providerNameText}</span></template>
                        <template if:true={result.billNumberText}><span class="ps-mi"><i>Bill no.</i>{result.billNumberText}</span></template>
                        <template if:true={result.billDateText}><span class="ps-mi"><i>Bill date</i>{result.billDateText}</span></template>
                        <template if:true={result.planName}><span class="ps-mi"><i>Plan</i>{result.planName}</span></template>
                    </div>

                    <div class="ps-cols">
                        <div class="ps-main">
                            <div class="ps-kicker ps-sub">Charges</div>
                            <div class="ps-box">
                                <template for:each={result.charges} for:item="charge">
                                    <div key={charge.key} class="ps-charge">
                                        <div class="ps-charge-main"><b class="ps-cname">{charge.description}</b>
                                            <div class="ps-cnote">{charge.printNote}</div>
                                            <template if:true={charge.flaggedAsUnreasonable}><div class="ps-flag">Priced above the typical rate for this service</div></template></div>
                                        <div class="ps-charge-amt"><span class="ps-cbilled">{charge.billedText}</span><b class="ps-cowe">owe {charge.owedText}</b></div>
                                    </div>
                                </template>
                            </div>
                            <template if:true={result.capNote}>
                                <p class="ps-cap">{result.capNote}</p>
                            </template>
                            <p class="ps-foot">An estimate, not a final bill. Your insurer and the provider set the final amount.</p>
                        </div>
                    </div>
                    <div class="ps-brandbar"><span>Care Compass &middot; Know what you owe, before you pay</span><span>Printed {printDate}</span></div>
                    </div>
                    <div class="screen-only" style="-webkit-print-color-adjust:exact;print-color-adjust:exact;">
                                        <div style="padding:18px 26px 20px;border-radius:20px;background:linear-gradient(135deg,#16213E 0%,#24335C 100%);color:#FBF8F3;box-shadow:0 10px 28px rgba(22,33,62,0.22);">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                            <span style="font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(251,248,243,0.75);">Estimated amount to pay</span>
                            <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(232,163,61,0.18);color:#E8A33D;">Estimate</span>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-top:4px;">
                            <span style="font-family:Georgia,serif;font-size:40px;font-weight:700;line-height:1.1;">{result.totalOwedText}</span>
                            <span style="font-size:14px;color:rgba(251,248,243,0.75);">of {result.totalBilledText} billed</span>
                        </div>
                        <div style="display:flex;height:8px;margin-top:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,0.12);">
                            <div style={result.barInsStyle}></div>
                            <div style={result.barOweStyle}></div>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-top:10px;font-size:13px;color:rgba(251,248,243,0.85);">
                            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#5CC28A;margin-right:6px;"></span>Insurance pays {result.insurancePaysText}</span>
                            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#E8A33D;margin-right:6px;"></span>You owe {result.totalOwedText}</span>
                        </div>
                    </div>

                    <p class="hint" style="margin-top:12px;"><template if:true={result.doctorName}>{result.doctorName} &middot; </template>{result.networkLabel}<template if:true={result.hasNetworkTip}><span role="button" tabindex="0" aria-label="What does this mean?" data-text={result.networkTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></template><template if:true={result.planName}> &middot; {result.planName}</template></p>

                    <template if:true={result.hasNotices}>
                        <div style="margin:16px 0 0;padding:12px 22px;background:#FFF8E8;border:1px solid #F1D9A8;border-left:4px solid #E8A33D;border-radius:14px;">
                            <p style="margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#9A5B00;">Before you pay</p>
                            <ul style="margin:0;padding:0;list-style:none;font-size:14px;line-height:1.5;color:#16213E;">
                                <template if:true={result.pendingClaim}>
                                    <li style="padding:2px 0;"><strong>Claim pending.</strong> Your insurer has not finished, so this amount is not final.</li>
                                </template>
                                <template if:true={result.networkAssumed}>
                                    <li style="padding:2px 0;"><strong>Doctor not found.</strong> We assumed in-network. You may owe more if the doctor is out-of-network.</li>
                                </template>
                                <template if:true={result.hasUnmatched}>
                                    <li style="padding:2px 0;"><strong>Some charges not matched.</strong> They are shown at full price. Open the charge to see why.</li>
                                </template>
                            </ul>
                        </div>
                    </template>


                    <p style="margin:22px 0 4px;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#6B7280;">Charges</p>

                    <template if:false={result.hasGroups}>
                    <div class="ledger">
                        <template for:each={result.charges} for:item="charge">
                            <div key={charge.key} class={charge.rowClass}>
                                <div class="ledger-main">
                                    <p class="ledger-description">{charge.description}</p>
                                    <p class="ledger-type">{charge.serviceType}</p>
                                    <p class="ledger-how">{charge.howCalculated}<template if:true={charge.hasHowTip}><span role="button" tabindex="0" aria-label="What do these terms mean?" data-text={charge.howTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></template></p>
                                </div>
                                <div class="ledger-amounts">
                                    <p class="ledger-billed">{charge.billedText} billed</p>
                                    <p class="ledger-owed">{charge.owedText}</p>
                                </div>
                                <template if:true={charge.flaggedAsUnreasonable}>
                                    <p class="flag-note">Priced above the typical rate for this service</p>
                                </template>
                            </div>
                        </template>
                    </div>
                    </template>

                    <template if:true={result.hasGroups}>
                        <div class="ledger" style="border-bottom:1px solid #E4DED2;">
                            <template for:each={result.groups} for:item="group">
                                <details key={group.key} class="group-block" style="margin:0;border:none;border-top:1px solid #E4DED2;border-radius:0;background:transparent;">
                                    <summary class="group-summary" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 4px;min-height:0;cursor:pointer;">
                                        <span class="group-name">{group.name}<span class="group-count"> &middot; {group.countLabel}</span></span>
                                        <span class="group-amounts" style="display:flex;flex-direction:row;align-items:baseline;gap:16px;text-align:right;white-space:nowrap;">
                                            <span class="group-billed" style="font-size:13px;">{group.billedText} billed</span>
                                            <span class="group-owed" style="font-size:16px;font-weight:700;">{group.owedText}</span>
                                        </span>
                                    </summary>
                                    <div style="margin:0 0 14px 6px;padding:2px 6px 2px 16px;border-left:2px solid #E4DED2;">
<template for:each={group.lines} for:item="charge">
                                        <div key={charge.key} class={charge.rowClass}>
                                            <div class="ledger-main">
                                                <p class="ledger-description">{charge.description}</p>
                                                <p class="ledger-type">{charge.serviceType}</p>
                                                <p class="ledger-how">{charge.howCalculated}<template if:true={charge.hasHowTip}><span role="button" tabindex="0" aria-label="What do these terms mean?" data-text={charge.howTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></template></p>
                                            </div>
                                            <div class="ledger-amounts">
                                                <p class="ledger-billed">{charge.billedText} billed</p>
                                                <p class="ledger-owed">{charge.owedText}</p>
                                            </div>
                                        </div>
                                    </template>
</div>
                                </details>
                            </template>
                        </div>
                    </template>

                    <template if:true={result.hasFlagged}>
                        <div style="margin:20px 0 0;padding:16px 18px;background:#FFF8E8;border:1px solid #F1D9A8;border-left:4px solid #E8A33D;border-radius:14px;">
                            <p style="margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#9A5B00;">Something look too high?</p>
                            <p style="margin:0;font-size:14px;line-height:1.5;color:#16213E;">{result.flaggedSummary} Ask the provider to review them. We wrote a letter and a phone script you can use.</p>
                            <button style="margin-top:12px;border:none;background:#16213E;color:#fff;font-family:inherit;font-size:13px;font-weight:600;line-height:1;padding:11px 20px;border-radius:999px;cursor:pointer;" onclick={toggleDispute}>{disputeButtonLabel}</button>
                            <template if:true={showDispute}>
                                <p style="margin:16px 0 6px;font-size:13px;font-weight:700;color:#16213E;">Letter to the billing office</p>
                                <textarea class="dispute-letter" readonly rows="14" aria-label="Dispute letter" style="width:100%;box-sizing:border-box;padding:12px;font-family:inherit;font-size:13px;line-height:1.5;color:#2B3340;background:#fff;border:1px solid #E4DED2;border-radius:10px;resize:vertical;"></textarea>
                                <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                                    <button style="border:1px solid #16213E;background:#fff;color:#16213E;font-family:inherit;font-size:13px;font-weight:600;line-height:1;padding:10px 18px;border-radius:999px;cursor:pointer;" onclick={copyLetter}>Copy letter</button>
                                    <span style="font-size:13px;color:#2E7D4F;">{copyMessage}</span>
                                </div>
                                <p style="margin:16px 0 6px;font-size:13px;font-weight:700;color:#16213E;">If you would rather call</p>
                                <ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.6;color:#16213E;">
                                    <li>Ask for the billing department and have your bill number ready.</li>
                                    <li>Say: "I would like a review of the charges I have marked on bill number ___."</li>
                                    <li>Ask whether the claim was sent to your insurance and whether anything was billed twice.</li>
                                    <li>Ask about a prompt-pay discount or financial assistance.</li>
                                    <li>Write down the date, the person's name and what they promised.</li>
                                </ol>
                                <p style="margin:12px 0 0;font-size:12px;line-height:1.5;color:#6B7280;">This is a starting point, not legal advice. The flag means a charge is above the typical price we have on file, not that it is wrong.</p>
                            </template>
                        </div>
                    </template>

                    <div style="margin:20px 0 0;border:1px solid #E4DED2;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(22,33,62,0.06);">
                        <div style="display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;color:#2B3340;">
                            <span>Total billed<span role="button" tabindex="0" aria-label="What is total billed?" data-text={result.totalTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></span><span style="font-weight:600;">{result.totalBilledText}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;color:#2B3340;border-top:1px solid #EEE9DC;">
                            <span>Insurance pays <span style="color:#6B7280;">(estimate)</span><span role="button" tabindex="0" aria-label="What does insurance pays mean?" data-text={result.insTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></span><span style="font-weight:600;color:#1B6B3A;">{result.insurancePaysText}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;font-size:16px;font-weight:700;color:#16213E;background:#F3EFE6;border-top:1px solid #EEE9DC;">
                            <span>You owe <span style="font-weight:400;color:#6B7280;font-size:13px;">(estimate)</span><span role="button" tabindex="0" aria-label="What does you owe mean?" data-text={result.oweTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span>
                                <template if:true={result.hasDeductibleApplied}><span style="display:block;font-weight:400;font-size:12px;color:#6B7280;">includes {result.deductibleAppliedText} toward your deductible<span role="button" tabindex="0" aria-label="What is a deductible?" data-text={result.dedTip} onmouseenter={handleTipOn} onmouseleave={handleTipOff} onfocus={handleTipOn} onblur={handleTipOff} onclick={handleTipToggle} onkeydown={handleTipKey} style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.2px solid #8A8F98;color:#6B7280;font-size:9px;line-height:1;font-weight:700;font-style:normal;font-family:Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;">i</span></span></template>
                            </span>
                            <span>{result.totalOwedText}</span>
                        </div>
                    </div>
                    <p class="hint" style="margin-top:8px;">An estimate, not a final bill. Your insurer and the provider set the final amount.</p>


                    <div class="result-buttons">
    <button class="reset-button" onclick={handlePrint}>Download summary</button>
    <button class="reset-button" onclick={handleReset}>Check another bill</button>
    <button class="home-button" onclick={handleGoHome}>Back to home</button>
</div>
                    </div>
                </template>

            </div>
        </div>
        <c-app-footer></c-app-footer>
    </div>

    <template if:true={tipVisible}>
        <div role="tooltip" style={tipBoxStyle}>{tipBoxText}</div>
    </template>
</template>
