<template>
    <div class="fp-page">
        <div class="fp-wrap">
            <div class="fp-brand">
                <svg viewBox="0 0 40 46" width="36" height="42" aria-hidden="true">
                    <path d="M20 2 L37 8 V23 C37 33 30 40 20 44 C10 40 3 33 3 23 V8 Z" fill="#24335C" stroke="#E8A33D" stroke-width="2" stroke-linejoin="round"></path>
                    <path d="M7 24 H14 L17 15 L22 32 L26 21 L28 24 H33" fill="none" stroke="#E8A33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>Care Compass</span>
            </div>

            <template lwc:if={isForm}>
                <div class="fp-card">
                    <h1 class="fp-title">Forgot your password?</h1>
                    <p class="fp-text">Enter your username and we will email a link to reset your password to the address on your account.</p>

                    <template if:true={errorMessage}>
                        <p class="fp-error" role="alert">{errorMessage}</p>
                    </template>

                    <label class="fp-label" for="fp-user">Username</label>
                    <input id="fp-user" class="fp-input" type="text" autocomplete="username" value={username} onchange={handleUsername} onkeyup={handleKey} />

                    <button class="fp-btn" onclick={handleSend} disabled={isSubmitting}>{submitLabel}</button>
                    <button class="fp-link" type="button" onclick={goLogin}>Back to login</button>
                </div>
            </template>

            <template lwc:else>
                <div class="fp-card fp-center">
                    <div class="fp-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="30" height="30"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#16213E" stroke-width="1.8"></rect><path d="M3.5 6.5 L12 13 L20.5 6.5" fill="none" stroke="#E8A33D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </div>
                    <h1 class="fp-title">Check your email</h1>
                    <p class="fp-text">If that username exists, we sent a link to reset the password. It can take a minute to arrive.</p>
                    <p class="fp-text fp-small">Nothing there? Look in your spam folder, or try again.</p>
                    <button class="fp-btn" onclick={goLogin}>Back to login</button>
                </div>
            </template>
        </div>
    </div>
</template>
