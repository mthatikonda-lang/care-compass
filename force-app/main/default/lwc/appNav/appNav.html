<template>
    <div class="an-banner">
        <div class="an-banner-inner">
            <div class="an-topbar">
                <button class="an-brand" onclick={goHome} aria-label="Care Compass home">
                    <svg class="an-logo" viewBox="0 0 40 46" width="30" height="35" aria-hidden="true">
                        <g class="an-logo-g">
                            <path class="an-logo-shield" pathLength="100" d="M20 2 L37 8 V23 C37 33 30 40 20 44 C10 40 3 33 3 23 V8 Z" fill="#24335C" stroke="#E8A33D" stroke-width="2" stroke-linejoin="round"></path>
                            <path class="an-logo-ecg" pathLength="100" d="M7 24 H14 L17 15 L22 32 L26 21 L28 24 H33" fill="none" stroke="#E8A33D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path class="an-logo-pulse" pathLength="100" d="M7 24 H14 L17 15 L22 32 L26 21 L28 24 H33" fill="none" stroke="#FFF1CF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </g>
                    </svg>
                    <span>Care Compass</span>
                </button>
                <template if:true={showMenu}>
                <nav class="an-nav-wrap" aria-label="Main">
                    <div class="an-pills">
                        <template for:each={tabs} for:item="t">
                            <button key={t.key} class={t.cls} data-url={t.url} onclick={handleNav}>{t.label}</button>
                        </template>
                    </div>
                    <button class="an-theme" onclick={toggleTheme} aria-label={themeLabel} aria-pressed={isDark} title={themeLabel}>
                        <template if:true={isDark}>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                        </template>
                        <template if:false={isDark}>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                        </template>
                    </button>
                    <div class="an-menu-wrap">
                        <button class={avatarClass} onclick={toggleMenu} aria-label="Patient details" aria-expanded={menuOpen}>{initials}</button>
                        <template if:true={menuOpen}>
                            <div class="an-menu" role="dialog" aria-label="Patient details">
                                <div class="an-menu-head">
                                    <span class="an-menu-avatar">{initials}</span>
                                    <div>
                                        <p class="an-menu-name">{patientName}</p>
                                        <p class="an-menu-sub">{patientLabel}</p>
                                    </div>
                                </div>
                                <template if:true={hasPlan}>
                                    <div class="an-menu-row"><span>Plan</span><b>{planName}</b></div>
                                </template>
                                <template if:true={hasMemberId}>
                                    <div class="an-menu-row"><span>Member ID</span><b>{memberId}</b></div>
                                </template>
                                <template if:true={hasDeductible}>
                                    <div class="an-menu-row"><span>Deductible</span><b>{deductibleText}</b></div>
                                </template>
                                <template if:true={hasOopMax}>
                                    <div class="an-menu-row"><span>Out-of-pocket max</span><b>{oopMaxText}</b></div>
                                </template>
                                <div class="an-menu-actions">
                                    <button class="an-menu-btn an-menu-btn-solid" data-url={profileUrl} onclick={handleNav}>View profile</button>
                                    <button class="an-menu-btn an-menu-btn-line" onclick={signOut}>Sign out</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </nav>
                </template>
                <template if:false={showMenu}>
                    <div class="an-setup-actions">
                        <button class="an-theme" onclick={toggleTheme} aria-label={themeLabel} aria-pressed={isDark} title={themeLabel}>
                            <template if:true={isDark}>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                            </template>
                            <template if:false={isDark}>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                            </template>
                        </button>
                        <button class="an-pill" onclick={signOut}>Sign out</button>
                    </div>
                </template>
            </div>
            <template if:true={heading}>
                <h1 class="an-title">{heading}</h1>
            </template>
            <template if:true={subtitle}>
                <p class="an-subtitle">{subtitle}</p>
            </template>
            <slot></slot>
        </div>
    </div>
</template>
